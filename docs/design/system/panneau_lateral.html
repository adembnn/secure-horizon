<h1 class="pl-title">Panneau latéral</h1>
<main class="pl-views">
<figure class="pl-view" id="v-pan-journal" style="--w:360"><figcaption>Panneau latéral. D’abord ce que tu peux encore fermer, ensuite ce qui s’est passé.</figcaption><div class="pl-frame" style="--w:360;--h:680">
<div class="hu hu-panel">
<div class="hu-top"><span class="hu-name">Hold up</span><span class="hu-2">Actif</span></div>
<div class="hu-scroll" tabindex="0" role="region" aria-label="Journal">
<h2 class="hu-h">Ce que tu as laissé ouvert</h2>
<ul>
<li class="hu-right"><p>app.neve.exchange peut dépenser 50 USDC.</p><button type="button" class="hu-word">Retirer ce droit</button></li>
<li class="hu-right"><p>old-farm.example peut dépenser tout ton USDC.</p><button type="button" class="hu-word">Retirer ce droit</button></li>
</ul>
<p class="hu-note">C’est ton portefeuille qui signe le retrait.</p>
<h2 class="hu-h">Aujourd’hui</h2>
<ol>
<li class="hu-entry"><time>14:32</time><p><span class="hu-entry-site">app.neve.exchange</span><span class="hu-entry-what"><strong>Ça ne correspondait pas.</strong> Tu as annulé.</span></p></li>
<li class="hu-entry"><time>14:30</time><p><span class="hu-entry-site">app.neve.exchange</span><span class="hu-entry-what">Ça correspondait.</span></p></li>
<li class="hu-entry"><time>11:07</time><p><span class="hu-entry-site">glacier-rewards.example</span><span class="hu-entry-what"><strong>Ça ne correspondait pas.</strong> Tu as annulé.</span></p></li>
</ol>
<h2 class="hu-h">Hier</h2>
<ol>
<li class="hu-entry"><time>18:44</time><p><span class="hu-entry-site">app.neve.exchange</span><span class="hu-entry-what">Je n’ai pas pu vérifier. Tu as annulé.</span></p></li>
<li class="hu-entry"><time>09:12</time><p><span class="hu-entry-site">app.neve.exchange</span><span class="hu-entry-what">Ça correspondait.</span></p></li>
</ol>
</div>
<div class="hu-foot"><button type="button" class="hu-word">Effacer le journal</button><button type="button" class="hu-word">Réglages</button></div>
</div>
</div></figure>

<figure class="pl-view" id="v-pan-ouvert" style="--w:360"><figcaption>« Ce que tu as laissé ouvert » pendant un retrait : un droit en cours, un droit retiré. Effacer demande un second clic.</figcaption><div class="pl-frame" style="--w:360;--h:680">
<div class="hu hu-panel">
<div class="hu-top"><span class="hu-name">Hold up</span><span class="hu-2">Actif</span></div>
<div class="hu-scroll" tabindex="0" role="region" aria-label="Journal">
<h2 class="hu-h">Ce que tu as laissé ouvert</h2>
<ul>
<li class="hu-right is-busy"><p>app.neve.exchange peut dépenser 50 USDC.</p><span class="hu-right-note" role="status">En cours…</span></li>
<li class="hu-right is-done"><p class="hu-2">old-farm.example ne peut plus rien dépenser.</p><span class="hu-right-note" role="status">Retiré</span></li>
<li class="hu-right"><p>pool.glacier.example peut dépenser 1 200 USDC.</p><button type="button" class="hu-word">Retirer ce droit</button></li>
</ul>
<p class="hu-note">C’est ton portefeuille qui signe le retrait.</p>
<h2 class="hu-h">Aujourd’hui</h2>
<ol>
<li class="hu-entry"><time>14:32</time><p><span class="hu-entry-site">app.neve.exchange</span><span class="hu-entry-what"><strong>Ça ne correspondait pas.</strong> Tu as continué.</span></p></li>
<li class="hu-entry"><time>14:30</time><p><span class="hu-entry-site">app.neve.exchange</span><span class="hu-entry-what">Ça correspondait.</span></p></li>
</ol>
</div>
<div class="hu-foot"><button type="button" class="hu-word">Effacer pour de bon ?</button><button type="button" class="hu-word">Réglages</button></div>
</div>
</div></figure>

<figure class="pl-view" id="v-pan-vide" style="--w:360"><figcaption>Panneau, état vide.</figcaption><div class="pl-frame" style="--w:360;--h:680">
<div class="hu hu-panel">
<div class="hu-top"><span class="hu-name">Hold up</span><span class="hu-2">Actif</span></div>
<div class="hu-scroll">
<p class="hu-state">Rien à raconter pour l’instant.</p>
<p class="hu-empty">Dès qu’un site te demande une signature, je te demande ce que tu veux faire. Ce que je réponds s’écrit ici.</p>
<div class="hu-links"><button type="button" class="hu-word">Essayer sur une page de test</button></div>
</div>
<div class="hu-foot"><button type="button" class="hu-word">Réglages</button></div>
</div>
</div></figure>
</main>
