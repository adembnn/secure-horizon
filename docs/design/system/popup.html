<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Hold up Popup</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="motion.css">
</head>
<body class="hu pl">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
<!-- Le gant : copie de docs/design/system/logo/logo_mono_blanc.svg (main seule ; le pli du pouce est tracé de la couleur du fond, sans masque : moins cher à peindre). L'icône : logo_small.svg. -->
<symbol id="hu-glove" viewBox="0 0 512 512"><g transform="translate(11 -56) rotate(8 256 256)" fill="currentColor" stroke-linecap="round"><path d="M150 150A38 38 0 0 1 226 150V272A8 8 0 0 0 242 272V122A35 35 0 0 1 312 122V272A8 8 0 0 0 328 272V160A31 31 0 0 1 390 160V330C390 388 350 424 300 424H236C180 424 150 400 150 340Z"/><path d="M214 388Q122 374 86 282" fill="none" stroke="currentColor" stroke-width="70"/><rect x="172" y="440" width="196" height="62" rx="24"/><path d="M170 322Q206 334 214 378" fill="none" stroke="var(--hu-page)" stroke-width="16"/></g></symbol>
<symbol id="hu-icon" viewBox="0 0 16 16"><rect width="16" height="16" rx="2.25" fill="#000"/><g fill="#fff"><path d="M4 3.5A1.5 1.5 0 0 1 7 3.5V7.5A.5 .5 0 0 0 8 7.5V2.5A1.5 1.5 0 0 1 11 2.5V7.5A.5 .5 0 0 0 12 7.5V4A1.5 1.5 0 0 1 15 4V9A3 3 0 0 1 12 12H7A3 3 0 0 1 4 9Z"/><path d="M5.6 9.6Q3.4 9.4 2.3 7.6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><rect x="6" y="13" width="7" height="2" rx="1"/></g></symbol>
</svg>
<h1 class="pl-title">Popup</h1>
<main class="pl-views">
<figure class="pl-view" id="v-pop-actif" style="--w:320"><figcaption>Popup de la barre d’outils, actif.</figcaption><div class="pl-frame pl-frame--auto" style="--w:320">
<div class="hu hu-pop">
<div class="hu-top"><span class="hu-name">Hold up</span><label class="hu-switch"><input type="checkbox" role="switch" checked aria-label="Vérifier ce site"><span class="hu-switch-on">Actif</span><span class="hu-switch-off">En pause</span></label></div>
<p class="hu-state">Je vérifie ce site.</p><p>app.neve.exchange</p>
<p class="hu-last">À 14:32, ça ne correspondait pas. Tu n’as rien envoyé.</p>
<div class="hu-links"><button type="button" class="hu-word">Journal</button><button type="button" class="hu-word">Réglages</button></div>
</div>
</div></figure>

<figure class="pl-view" id="v-pop-pause" style="--w:320"><figcaption>Popup, en pause sur ce site.</figcaption><div class="pl-frame pl-frame--auto" style="--w:320">
<div class="hu hu-pop">
<div class="hu-top"><span class="hu-name">Hold up</span><label class="hu-switch"><input type="checkbox" role="switch" aria-label="Vérifier ce site"><span class="hu-switch-on">Actif</span><span class="hu-switch-off">En pause</span></label></div>
<p class="hu-state">En pause sur ce site.</p><p>Ce que demande app.neve.exchange va droit à ton portefeuille.</p>
<div class="hu-links"><button type="button" class="hu-word">Journal</button><button type="button" class="hu-word">Réglages</button></div>
</div>
</div></figure>

<figure class="pl-view" id="v-pop-rien" style="--w:320"><figcaption>Popup, sur une page où il n’y a rien à vérifier.</figcaption><div class="pl-frame pl-frame--auto" style="--w:320">
<div class="hu hu-pop">
<div class="hu-top"><span class="hu-name">Hold up</span><label class="hu-switch"><input type="checkbox" role="switch" disabled aria-label="Vérifier ce site"><span class="hu-switch-off">Rien à vérifier ici</span></label></div>
<p class="hu-state">Je ne peux pas agir sur cette page.</p><p>C’est une page du navigateur. Aucun site ne peut s’y servir de ton portefeuille.</p>
<div class="hu-links"><button type="button" class="hu-word">Journal</button><button type="button" class="hu-word">Réglages</button></div>
</div>
</div></figure>
</main>
</body>
</html>
