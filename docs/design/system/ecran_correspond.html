<h1 class="pl-title">Ça correspond</h1>
<main class="pl-views">
<figure class="pl-view" id="v-c-simple" style="--w:424"><figcaption>Ça correspond. Pas de bouton : la demande part seule après une seconde, le trait se vide pour le dire.</figcaption><div class="pl-frame" style="--w:424;--h:501">
<div class="hu hu-k hu-win" data-outcome="match"><div class="hu-stage">
<p class="hu-head"><b>app.neve.exchange</b></p>
<div class="hu-mid">
<h1 class="hu-verdict hu-m" tabindex="-1">Ça correspond à ce que tu as écrit.</h1>
<p class="hu-line hu-m" style="--hu-i:1">La demande échange 50 USDC contre AVAX.</p>
</div>
<div class="hu-dock"><button type="button" class="hu-word">Annuler</button><p class="hu-leave">Ça part vers ton portefeuille.<span class="hu-leave-bar"></span></p></div>

</div></figure>

<figure class="pl-view" id="v-c-limite" style="--w:424"><figcaption>Ça correspond, et j’ai limité le droit que le site demandait.</figcaption><div class="pl-frame" style="--w:424;--h:501">

<p class="hu-head"><b>app.neve.exchange</b></p>

</div></figure>
