<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neve — échange de jetons</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<header class="top">
  <div class="top-inner">
    <span class="wordmark">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3 L21 20 H3 Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      Neve
    </span>
    <span class="net" id="net"><i></i><span id="net-text">Vérification du réseau</span></span>
  </div>
</header>

<main class="page">
  <section class="swap">
    <h1>Échanger</h1>

    <div class="leg">
      <span class="leg-label">Vous payez</span>
      <div class="leg-row">
        <span class="leg-amount">50</span>
        <span class="leg-token">DUSDC</span>
      </div>
    </div>

    <div class="arrow" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 5 V19 M6 13 l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <div class="leg">
      <span class="leg-label">Vous recevez (estimation)</span>
      <div class="leg-row">
        <span class="leg-amount" id="out-amount">0,50</span>
        <span class="leg-token">AVAX</span>
      </div>
    </div>

    <p class="rate">1 AVAX = 100 DUSDC &middot; frais inclus</p>

    <button class="btn" id="btn-swap" type="button" disabled>Connexion du portefeuille</button>
    <p class="state" id="state"><span class="text">En attente du portefeuille.</span></p>
  </section>

  <footer class="foot">
    <span id="acct">Non connecté</span>
  </footer>
</main>

<script src="./chain-utils.js"></script>
<script src="./app.js"></script>
</body>
</html>
