<h1 class="pl-title">Question</h1>
<main class="pl-views">
<figure class="pl-view" id="v-q-vide" style="--w:424"><figcaption>La question, à l’ouverture. Le curseur est dans le champ.</figcaption><div class="pl-frame" style="--w:424;--h:501">
<div class="hu hu-k hu-win"><div class="hu-stage">
<p class="hu-head hu-m"><b>app.neve.exchange</b> demande une signature.</p>
<h1 class="hu-title hu-m" id="q-vide-t">Que veux-tu faire ?</h1>
<textarea class="hu-field hu-m" style="--hu-i:1" aria-labelledby="q-vide-t" placeholder="échanger 50 USDC contre AVAX" spellcheck="false" maxlength="500"></textarea>
<div class="hu-got hu-m" style="--hu-i:1" role="status"><span class="hu-got-say">Ce que j’ai compris</span><span class="hu-slot"><span class="hu-slot-q">quoi</span><span class="hu-slot-v"></span></span><span class="hu-slot"><span class="hu-slot-q">combien</span><span class="hu-slot-v"></span></span><span class="hu-slot"><span class="hu-slot-q">à qui</span><span class="hu-slot-v"></span></span></div>
<div class="hu-under hu-m" style="--hu-i:1"><p class="hu-assume">Le reste, je le suppose : rien de plus, rien de durable, tout revient sur ton compte.</p><p class="hu-busy" aria-hidden="true">Je compare ta phrase à la demande.</p></div>
<div class="hu-dock"><button type="button" class="hu-word">Annuler</button><button type="button" class="hu-cuff" aria-disabled="true">Vérifier</button></div>
</div></div>
</div></figure>

<figure class="pl-view" id="v-q-frappe" style="--w:424"><figcaption>Pendant la frappe. Deux valeurs sont arrivées, la troisième attend.</figcaption><div class="pl-frame" style="--w:424;--h:501">
<div class="hu hu-k hu-win"><div class="hu-stage">
<p class="hu-head hu-m"><b>app.neve.exchange</b> demande une signature.</p>
<h1 class="hu-title hu-m" id="q-frappe-t">Que veux-tu faire ?</h1>
<textarea class="hu-field hu-m" style="--hu-i:1" aria-labelledby="q-frappe-t" placeholder="échanger 50 USDC contre AVAX" spellcheck="false" maxlength="500">échanger 50 USDC</textarea>
<div class="hu-got hu-m" style="--hu-i:1" role="status"><span class="hu-got-say">Ce que j’ai compris</span><span class="hu-slot is-filled"><span class="hu-slot-q">quoi</span><span class="hu-slot-v">échanger</span></span><span class="hu-slot is-filled"><span class="hu-slot-q">combien</span><span class="hu-slot-v">50 USDC</span></span><span class="hu-slot"><span class="hu-slot-q">contre quoi</span><span class="hu-slot-v"></span></span></div>
<div class="hu-under hu-m" style="--hu-i:1"><p class="hu-assume">Le reste, je le suppose : rien de plus, rien de durable, tout revient sur ton compte.</p><p class="hu-busy" aria-hidden="true">Je compare ta phrase à la demande.</p></div>
<div class="hu-dock"><button type="button" class="hu-word">Annuler</button><button type="button" class="hu-cuff">Vérifier</button></div>
</div></div>
</div></figure>

<figure class="pl-view" id="v-q-complet" style="--w:424"><figcaption>Tout est compris. Le compte qui signe est rappelé sous les trois places.</figcaption><div class="pl-frame" style="--w:424;--h:501">
<div class="hu hu-k hu-win"><div class="hu-stage">
<p class="hu-head hu-m"><b>app.neve.exchange</b> demande une signature.</p>
<h1 class="hu-title hu-m" id="q-complet-t">Que veux-tu faire ?</h1>
<textarea class="hu-field hu-m" style="--hu-i:1" aria-labelledby="q-complet-t" placeholder="échanger 50 USDC contre AVAX" spellcheck="false" maxlength="500">échanger 50 USDC contre AVAX</textarea>
<div class="hu-got hu-m" style="--hu-i:1" role="status"><span class="hu-got-say">Ce que j’ai compris</span><span class="hu-slot is-filled"><span class="hu-slot-q">quoi</span><span class="hu-slot-v">échanger</span></span><span class="hu-slot is-filled"><span class="hu-slot-q">combien</span><span class="hu-slot-v">50 USDC</span></span><span class="hu-slot is-filled"><span class="hu-slot-q">contre quoi</span><span class="hu-slot-v">contre AVAX</span></span><span class="hu-got-from">depuis ton compte 0x71c4…9a3f</span></div>
<div class="hu-under hu-m" style="--hu-i:1"><p class="hu-assume">Le reste, je le suppose : rien de plus, rien de durable, tout revient sur ton compte.</p><p class="hu-busy" aria-hidden="true">Je compare ta phrase à la demande.</p></div>
<div class="hu-dock"><button type="button" class="hu-word">Annuler</button><button type="button" class="hu-cuff">Vérifier</button></div>
</div></div>
</div></figure>

<figure class="pl-view" id="v-q-erreur" style="--w:424"><figcaption>Entrée sur un champ vide. La phrase d’erreur prend la place de la ligne grise, rien ne bouge.</figcaption><div class="pl-frame" style="--w:424;--h:501">
<div class="hu hu-k hu-win"><div class="hu-stage">
<p class="hu-head hu-m"><b>app.neve.exchange</b> demande une signature.</p>
<h1 class="hu-title hu-m" id="q-erreur-t">Que veux-tu faire ?</h1>
<textarea class="hu-field hu-m" style="--hu-i:1" aria-labelledby="q-erreur-t" aria-invalid="true" aria-describedby="q-erreur-e" placeholder="échanger 50 USDC contre AVAX" spellcheck="false" maxlength="500"></textarea>
<div class="hu-got hu-m" style="--hu-i:1" role="status"><span class="hu-got-say">Ce que j’ai compris</span><span class="hu-slot"><span class="hu-slot-q">quoi</span><span class="hu-slot-v"></span></span><span class="hu-slot"><span class="hu-slot-q">combien</span><span class="hu-slot-v"></span></span><span class="hu-slot"><span class="hu-slot-q">à qui</span><span class="hu-slot-v"></span></span></div>
<div class="hu-under hu-m" style="--hu-i:1"><p class="hu-error" id="q-erreur-e" role="alert">Écris d’abord ce que tu veux faire.</p></div>
<div class="hu-dock"><button type="button" class="hu-word">Annuler</button><button type="button" class="hu-cuff" aria-disabled="true">Vérifier</button></div>
</div></div>
</div></figure>

<figure class="pl-view" id="v-q-compare" style="--w:424"><figcaption>La vérification dure plus de 150 ms : le champ se fige, le bouton le dit.</figcaption><div class="pl-frame" style="--w:424;--h:501">
<div class="hu hu-k hu-win hu-is-busy"><div class="hu-stage">
<p class="hu-head hu-m"><b>app.neve.exchange</b> demande une signature.</p>
<h1 class="hu-title hu-m" id="q-compare-t">Que veux-tu faire ?</h1>
<textarea class="hu-field hu-m" style="--hu-i:1" aria-labelledby="q-compare-t" readonly spellcheck="false" maxlength="500">échanger 50 USDC contre AVAX</textarea>
<div class="hu-got hu-m" style="--hu-i:1" role="status"><span class="hu-got-say">Ce que j’ai compris</span><span class="hu-slot is-filled"><span class="hu-slot-q">quoi</span><span class="hu-slot-v">échanger</span></span><span class="hu-slot is-filled"><span class="hu-slot-q">combien</span><span class="hu-slot-v">50 USDC</span></span><span class="hu-slot is-filled"><span class="hu-slot-q">contre quoi</span><span class="hu-slot-v">contre AVAX</span></span></div>
<div class="hu-under hu-m" style="--hu-i:1"><p class="hu-assume" aria-hidden="true">Le reste, je le suppose : rien de plus, rien de durable, tout revient sur ton compte.</p><p class="hu-busy">Je compare ta phrase à la demande.</p></div>
<div class="hu-dock"><button type="button" class="hu-word">Annuler</button><button type="button" class="hu-cuff" aria-disabled="true">Je compare…</button></div>
</div></div>
</div></figure>
</main>
</body>
</html>
