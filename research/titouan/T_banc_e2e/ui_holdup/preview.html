<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hold up : relecture des écrans</title>
<link rel="stylesheet" href="verdict.css">
<style>
  :root { --pbg: #f5f5f5; --pink: #000; --pmuted: #595959; --pline: #d0d0d0; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --pbg: #0c0c0c; --pink: #fff; --pmuted: #a6a6a6; --pline: #2a2a2a; } }
  :root[data-theme="dark"] { --pbg: #0c0c0c; --pink: #fff; --pmuted: #a6a6a6; --pline: #2a2a2a; }
  body { margin: 0; background: var(--pbg); color: var(--pink); font: 16px/1.4 system-ui, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; padding: 12px 16px; background: var(--pbg); border-bottom: 1px solid var(--pline); }
  header h1 { margin: 0 8px 0 0; font-size: 20px; flex: 1 1 100%; }
  label.ctl { display: grid; gap: 2px; font-size: 14px; color: var(--pmuted); }
  select, input[type=search] { font: inherit; min-height: 36px; padding: 0 8px; color: var(--pink); background: var(--pbg); border: 1.5px solid var(--pmuted); border-radius: 6px; }
  .note { margin: 0; padding: 8px 16px; font-size: 14px; color: var(--pmuted); }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 20px; padding: 16px; }
  .card { border: 1px solid var(--pline); border-radius: 12px; padding: 12px; background: color-mix(in srgb, var(--pbg) 94%, var(--pink)); }
  .card h2 { margin: 0 0 8px; font-size: 14px; font-weight: 600; color: var(--pmuted); }
  .out { margin: 8px 0 0; font: 13px/1.3 ui-monospace, Consolas, monospace; color: var(--pmuted); min-height: 1.3em; }
  @media (max-width: 520px) { main { grid-template-columns: 1fr; padding: 16px; } }
</style>
</head>
<body>
<header>
  <h1>Hold up : relecture des 30 fiches (données fictives)</h1>
  <label class="ctl">Thème
    <select id="theme"><option value="">Selon le système</option><option value="light">Clair</option><option value="dark">Sombre</option></select>
  </label>
  <label class="ctl">Friction
    <select id="friction"><option value="none">Aucun délai</option><option value="wait30">30 secondes</option><option value="phrase">Retaper une phrase</option></select>
  </label>
  <label class="ctl">Écran
    <select id="mode"></select>
  </label>
  <label class="ctl">Filtre
    <input type="search" id="q" placeholder="F13, adresse…">
  </label>
</header>
<p class="note">Prévisualisation sans extension : aucun envoi, aucune signature. Chaque bouton répond dans la ligne grise sous l'écran.</p>
<main id="grid"></main>
<script src="verdict.js"></script>
<script src="demo.js"></script>
<script src="preview_data.js"></script>
<script src="preview.js"></script>
</body>
</html>
