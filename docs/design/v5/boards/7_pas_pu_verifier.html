<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hold up v5 : 7. Pas pu vérifier</title>
<style>/* Hold up - the window's surface. System : docs/design/v5/DESIGN.md.
 * Two moments (question, answer), one column, near-monochrome, ONE signal colour used once per screen
 * (the sentence "Ça ne correspond pas…"). No shadow, no gradient, no icon, no card. System fonts only.
 * Everything hangs under .hu so the same sheet draws the real window and the reference boards.
 *
 * Contrast (WCAG 2.x)  light : ink #171717 on #fff 17.9:1 · ink-2 #5c5c5c 6.7:1 · signal #c9281c 5.6:1 · edge #8c8c8c 3.4:1 (control border)
 *                      dark  : ink #ededed on #131313 15.6:1 · ink-2 #a3a3a3 7.3:1 · signal #ff7061 7.1:1 · edge #7a7a7a 4.2:1 */
.hu {
  --hu-bg: #ffffff;
  --hu-ink: #171717;
  --hu-ink-2: #5c5c5c;
  --hu-line: #e5e5e5;
  --hu-edge: #8c8c8c;
  --hu-hover: #f5f5f5;
  --hu-signal: #c9281c;
  --hu-on-ink: #ffffff;
  --hu-sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, sans-serif;
  --hu-display: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, sans-serif;
  --hu-mono: "Cascadia Mono", "SF Mono", ui-monospace, Consolas, "Roboto Mono", monospace;
  --hu-r: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  .hu:not([data-theme="light"]) {
    --hu-bg: #131313; --hu-ink: #ededed; --hu-ink-2: #a3a3a3; --hu-line: #2b2b2b; --hu-edge: #7a7a7a; --hu-hover: #1f1f1f;
    --hu-signal: #ff7061; --hu-on-ink: #131313; color-scheme: dark;
  }
}
.hu[data-theme="dark"] {
  --hu-bg: #131313; --hu-ink: #ededed; --hu-ink-2: #a3a3a3; --hu-line: #2b2b2b; --hu-edge: #7a7a7a; --hu-hover: #1f1f1f;
  --hu-signal: #ff7061; --hu-on-ink: #131313; color-scheme: dark;
}

.hu, .hu *, .hu *::before, .hu *::after { box-sizing: border-box; }
.hu {
  display: flex; flex-direction: column; width: 100%; height: 100%; min-height: 0; container-type: size;
  background: var(--hu-bg); color: var(--hu-ink);
  font-family: var(--hu-sans); font-size: 17px; line-height: 1.5; font-weight: 400;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
.hu ::selection { background: var(--hu-ink); color: var(--hu-bg); }
.hu [hidden] { display: none !important; }

/* ---- the column */
.hu-main { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 48px 32px 8px; text-align: center; }
.hu-col { max-width: 360px; margin: 0 auto; }
.hu-title {
  margin: 0; font-family: var(--hu-display); font-size: 27px; line-height: 1.22; font-weight: 400; letter-spacing: -0.015em;
  text-wrap: balance; overflow-wrap: anywhere;
}
.hu-title:focus { outline: none; }
.hu[data-outcome="mismatch"] .hu-title { color: var(--hu-signal); }
.hu-line { margin: 16px 0 0; text-wrap: pretty; overflow-wrap: anywhere; }
.hu-quiet { margin: 12px 0 0; font-size: 15px; line-height: 1.45; color: var(--hu-ink-2); }
.hu-note { margin: 20px 0 0; font-size: 13px; line-height: 1.4; color: var(--hu-ink-2); }
.hu-end { margin: auto; padding: 32px; max-width: 360px; text-align: center; text-wrap: balance; }

/* ---- the question field */
.hu-field {
  display: block; width: 100%; margin: 24px 0 0; padding: 12px 14px; min-height: 104px; resize: none;
  font: inherit; line-height: 1.45; color: var(--hu-ink); caret-color: var(--hu-ink); text-align: left;
  background: var(--hu-bg); border: 1px solid var(--hu-edge); border-radius: var(--hu-r);
  transition: border-color 120ms ease-out, box-shadow 120ms ease-out;
}
.hu-field::placeholder { color: var(--hu-ink-2); opacity: 1; }
.hu-field:hover { border-color: var(--hu-ink); }
.hu-field:focus { outline: none; border-color: var(--hu-ink); box-shadow: 0 0 0 1px var(--hu-ink); }
.hu-field[readonly] { color: var(--hu-ink-2); border-color: var(--hu-line); box-shadow: none; }

/* ---- two addresses, 2 rows of 5 groups of 4 */
.hu-addr { margin: 24px 0 0; text-align: left; }
.hu-addr + .hu-addr { margin-top: 16px; }
.hu-addr-label { margin: 0 0 4px; font-size: 13px; line-height: 1.4; color: var(--hu-ink-2); }
.hu-addr-grid {
  display: grid; grid-template-columns: repeat(5, auto); justify-content: space-between; row-gap: 2px; margin: 0;
  font-family: var(--hu-mono); font-size: 16px; line-height: 1.5; font-variant-numeric: tabular-nums slashed-zero; color: var(--hu-ink-2);
}
/* what differs is set in ink and heavier ; what is identical (the part a look-alike copies) stays quiet. Weight carries it, not colour alone. */
.hu-addr-grid b { font-weight: 700; color: var(--hu-ink); }
.hu-sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }

/* ---- the dock : Annuler always left, the forward action always right ; only the weight moves */
.hu-dock { flex: none; padding: 12px 24px 24px; }
.hu-wait { min-height: 22px; max-width: 392px; margin: 0 auto 12px; font-size: 15px; line-height: 22px; text-align: center; color: var(--hu-ink-2); font-variant-numeric: tabular-nums; }
.hu-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 392px; margin: 0 auto; }
.hu-btn {
  min-height: 48px; padding: 0 16px; font: inherit; font-size: 16px; font-weight: 500; line-height: 1.2; cursor: pointer;
  color: var(--hu-ink); background: transparent; border: 1px solid var(--hu-edge); border-radius: var(--hu-r);
  transition: background-color 120ms ease-out, border-color 120ms ease-out, color 120ms ease-out;
}
.hu-btn:hover { background: var(--hu-hover); border-color: var(--hu-ink); }
.hu-btn:focus-visible { outline: 2px solid var(--hu-ink); outline-offset: 2px; }
.hu-btn.is-primary { color: var(--hu-on-ink); background: var(--hu-ink); border-color: var(--hu-ink); }
.hu-btn.is-primary:hover { background: color-mix(in srgb, var(--hu-ink) 86%, var(--hu-bg)); border-color: transparent; }
.hu-btn[aria-disabled="true"] { cursor: default; color: var(--hu-ink-2); background: transparent; border-color: var(--hu-line); }
.hu-btn.is-primary[aria-disabled="true"] { color: var(--hu-ink-2); background: var(--hu-hover); border-color: var(--hu-hover); }

/* ---- small windows (container queries : the boards draw several sizes on one page) */
@container (max-width: 400px) {
  .hu-main { padding: 32px 20px 8px; }
  .hu-title { font-size: 24px; }
  .hu-dock { padding: 12px 16px 16px; }
  .hu-addr-grid { font-size: 15px; }
}
@container (max-height: 460px) {
  .hu-main { padding-top: 24px; }
  .hu-title { font-size: 23px; }
  .hu-field { min-height: 80px; margin-top: 16px; }
}
@media (prefers-reduced-motion: reduce) { .hu * { transition: none !important; } }

      main.appendChild(col); dock.appendChild(wait); dock.appendChild(actions);

    }
    function cancelButton(primary) { var b = button(T.cancel, primary); b.addEventListener('click', function () { on.onCancel('button'); }); return b; }

    function question(s) {
      var f = frame();
      var title = el('h1', 'hu-title', s.title); title.id = 'hu-q';
