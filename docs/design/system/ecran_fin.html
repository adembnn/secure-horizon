<link rel="stylesheet" href="components.css">

</head>
<body class="hu pl">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

<symbol id="hu-icon" viewBox="0 0 16 16"><rect width="16" height="16" rx="2.25" fill="#000"/><g fill="#fff"><path d="M4 3.5A1.5 1.5 0 0 1 7 3.5V7.5A.5 .5 0 0 0 8 7.5V2.5A1.5 1.5 0 0 1 11 2.5V7.5A.5 .5 0 0 0 12 7.5V4A1.5 1.5 0 0 1 15 4V9A3 3 0 0 1 12 12H7A3 3 0 0 1 4 9Z"/><path d="M5.6 9.6Q3.4 9.4 2.3 7.6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><rect x="6" y="13" width="7" height="2" rx="1"/></g></symbol>

<h1 class="pl-title">Fin d’une demande</h1>
<main class="pl-views">
<figure class="pl-view" id="v-fin-expiree" style="--w:424"><figcaption>Une demande retenue expire après trois minutes sans geste. La fenêtre reste, pour que la personne le lise à son retour.</figcaption><div class="pl-frame" style="--w:424;--h:501">
<div class="hu hu-k hu-win"><div class="hu-stage">
<div class="hu-mid">
<h1 class="hu-verdict hu-m" tabindex="-1">Demande expirée. Rien n’a été envoyé.</h1>
<p class="hu-line hu-m" style="--hu-i:1">Elle a attendu trois minutes sans réponse.</p>
<p class="hu-next hu-m" style="--hu-i:1">Tu peux la relancer depuis app.neve.exchange.</p>
</div>
<div class="hu-dock hu-dock--end"><button type="button" class="hu-cuff">Fermer</button></div>
</div></div>
</div></figure>

<figure class="pl-view" id="v-fin-annulee" style="--w:424"><figcaption>Après « Ne rien envoyer » ou Échap : une phrase, 700 ms, puis la fenêtre se ferme seule.</figcaption><div class="pl-frame" style="--w:424;--h:501">
<div class="hu hu-k hu-win"><div class="hu-stage">
<p class="hu-end hu-m" role="status">Demande annulée. Rien n’a été envoyé.</p>
</div></div>
</div></figure>

<figure class="pl-view" id="v-fin-attente" style="--w:424"><figcaption>La première demande est partie, la suite n’est pas encore arrivée. La fenêtre attend, elle ne se ferme pas.</figcaption><div class="pl-frame" style="--w:424;--h:501">
<div class="hu hu-k hu-win"><div class="hu-stage">
<p class="hu-head"><b>app.neve.exchange</b></p>
<div class="hu-mid">
<h1 class="hu-verdict hu-m" tabindex="-1">C’est parti vers ton portefeuille.</h1>
<p class="hu-line hu-m" style="--hu-i:1">J’attends la suite de ton échange.</p>
<p class="hu-next hu-m" style="--hu-i:1">Rien d’autre ne partira sans vérification.</p>
</div>
<div class="hu-dock hu-dock--end"><button type="button" class="hu-word">Fermer</button></div>
</div></div>
</div></figure>
</main>
</body>
</html>
