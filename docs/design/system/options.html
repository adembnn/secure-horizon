<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Hold up Réglages</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="motion.css">
</head>
<body class="hu pl">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
<!-- Le gant : copie de docs/design/system/logo/logo_mono_blanc.svg (main seule ; le pli du pouce est tracé de la couleur du fond, sans masque : moins cher à peindre). L'icône : logo_small.svg. -->
<symbol id="hu-glove" viewBox="0 0 512 512"><g transform="translate(11 -56) rotate(8 256 256)" fill="currentColor" stroke-linecap="round"><path d="M150 150A38 38 0 0 1 226 150V272A8 8 0 0 0 242 272V122A35 35 0 0 1 312 122V272A8 8 0 0 0 328 272V160A31 31 0 0 1 390 160V330C390 388 350 424 300 424H236C180 424 150 400 150 340Z"/><path d="M214 388Q122 374 86 282" fill="none" stroke="currentColor" stroke-width="70"/><rect x="172" y="440" width="196" height="62" rx="24"/><path d="M170 322Q206 334 214 378" fill="none" stroke="var(--hu-page)" stroke-width="16"/></g></symbol>
<symbol id="hu-icon" viewBox="0 0 16 16"><rect width="16" height="16" rx="2.25" fill="#000"/><g fill="#fff"><path d="M4 3.5A1.5 1.5 0 0 1 7 3.5V7.5A.5 .5 0 0 0 8 7.5V2.5A1.5 1.5 0 0 1 11 2.5V7.5A.5 .5 0 0 0 12 7.5V4A1.5 1.5 0 0 1 15 4V9A3 3 0 0 1 12 12H7A3 3 0 0 1 4 9Z"/><path d="M5.6 9.6Q3.4 9.4 2.3 7.6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><rect x="6" y="13" width="7" height="2" rx="1"/></g></symbol>
</svg>
<h1 class="pl-title">Réglages</h1>
<main class="pl-views">
<figure class="pl-view" id="v-options" style="--w:1280"><figcaption>Réglages. Chaque changement s’enregistre seul.</figcaption><div class="pl-frame" style="--w:1280;--h:800">
<div class="hu hu-tab"><div class="hu-tab-in"><div class="hu-col">
<h1 class="hu-page-title">Réglages</h1>
<p role="status">Enregistré.</p>
<h2 class="hu-h">La question</h2>
<div class="hu-set"><label for="o-ask">Je te demande ce que tu veux faire</label><span class="hu-set-ctl"><span class="hu-pick"><select class="hu-select" id="o-ask"><option>avant chaque signature</option><option>quand la demande donne un droit ou sort de l’argent</option><option>jamais</option></select><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg></span></span></div>
<div class="hu-set"><span id="o-win-l">Je pose la question dans une fenêtre à part<span class="hu-set-msg hu-2">Sinon elle s’affiche dans la page du site, qui peut la masquer.</span></span><label class="hu-switch hu-set-ctl"><input type="checkbox" role="switch" checked aria-labelledby="o-win-l"><span class="hu-switch-on">Oui</span><span class="hu-switch-off">Non</span></label></div>
<div class="hu-set"><span id="o-lim-l">Je limite le droit au montant que tu as écrit</span><label class="hu-switch hu-set-ctl"><input type="checkbox" role="switch" checked aria-labelledby="o-lim-l"><span class="hu-switch-on">Oui</span><span class="hu-switch-off">Non</span></label></div>
<h2 class="hu-h">L’attente</h2>
<div class="hu-set"><label for="o-wait">Quand ça ne correspond pas, tu attends avant de pouvoir continuer</label><span class="hu-set-ctl"><input class="hu-input" id="o-wait" type="number" min="5" max="600" value="30" inputmode="numeric"> secondes</span></div>
<div class="hu-set"><label for="o-hold">Quand quelqu’un te presse sur la page, je retiens la demande</label><span class="hu-set-ctl"><input class="hu-input" id="o-hold" type="number" min="1" max="60" value="10" inputmode="numeric"> minutes</span></div>
<h2 class="hu-h">Le journal</h2>
<p class="hu-2">Il reste sur cet ordinateur. Il ne contient ni ta phrase ni d’adresse.</p>
<div class="hu-links" style="margin-top:12px"><button type="button" class="hu-word">Exporter le journal</button><button type="button" class="hu-word">Effacer le journal</button></div>
</div></div></div>
</div></figure>
</main>
</body>
</html>
